appId: com.jaquelene.desktop
productName: Jaquelene
asar: true
directories:
  output: ../../release/jaquelene-desktop
files:
  - dist-electron/**
  - package.json
extraResources:
  - from: ../jaquelene-web/dist
    to: web
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
linux:
  target: AppImage
  category: Utility
