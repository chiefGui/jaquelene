name: Windows package

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun ci

      - name: Build Windows package
        run: bun run package:windows

      - name: Verify Windows package
        run: bun run verify:package:windows

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jaquelene-windows-x64-${{ github.sha }}
          path: |
            release/jaquelene-desktop/Jaquelene-*-windows-x64-setup.exe
            release/jaquelene-desktop/Jaquelene-*-windows-x64-setup.exe.blockmap
            release/jaquelene-desktop/latest.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
