appId: com.jaquelene.desktop
productName: Jaquelene
asar: true
directories:
  output: ../../release/jaquelene-desktop
files:
  - dist/**
  - dist-electron/**
  - package.json
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
linux:
  target: AppImage
  category: Utility
